name: Capturas

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capturas:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: "8.11.1"
        cache-disabled: true

    - name: Build APK debug
      run: ./gradlew assembleDebug --no-daemon

    - name: Activar KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Emulador y capturas
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        target: google_apis
        profile: pixel_2
        disable-animations: true
        script: |
          mkdir -p capturas
          bash -x scripts/capturas.sh 2> capturas/trace.txt

    - name: Guardar capturas como artefacto
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: capturas
        path: capturas/

    - name: Subir capturas a la rama "capturas"
      if: always()
      run: |
        git config user.name "github-actions"
        git config user.email "actions@users.noreply.github.com"
        git checkout -B capturas
        mkdir -p docs/play/capturas && cp capturas/* docs/play/capturas/ 2>/dev/null || true
        git add -f docs/play/capturas
        git commit -m "Capturas generadas en el emulador" || exit 0
        git push -f origin capturas
