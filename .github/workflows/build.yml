name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: "8.2"
        cache-disabled: true
      
    - name: Build APK
      run: gradle assembleDebug --no-daemon
      
    - name: Verificar que compila la variante release (sin registro de diagnóstico)
      run: gradle assembleRelease --no-daemon

    - name: Build bundle .aab para Google Play (solo si están cargadas las claves)
      env:
        KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      run: |
        if [ -n "$KEYSTORE_B64" ]; then
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export RELEASE_KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          gradle bundleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab peaje-cognitivo.aab
        else
          echo "Sin claves de firma cargadas: se omite el .aab"
        fi

    - name: Guardar .aab
      if: hashFiles('peaje-cognitivo.aab') != ''
      uses: actions/upload-artifact@v4
      with:
        name: peaje-cognitivo-aab
        path: peaje-cognitivo.aab

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: peaje-cognitivo-apk
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Publicar Release con el APK
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk peaje-cognitivo.apk
        gh release create "build-${{ github.run_number }}" peaje-cognitivo.apk modulos/*.json \
          --title "Peaje Cognitivo - build #${{ github.run_number }}" \
          --notes "Compilado desde el commit ${{ github.sha }}" \
          --target "${{ github.sha }}" \
          --latest
